name: Apply MiMo file-to-md patch

on:
  push:
    branches:
      - feat/mimo-file-to-md
    paths:
      - tools/apply_mimo_patch.py
      - .github/workflows/apply-mimo-file-to-md.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_mimo_patch.py

      - name: Syntax check
        run: node --check main.js

      - name: Existing regression suite
        run: node tests/bindtest.js

      - name: MiMo focused tests
        run: node tests/mimo-file-to-md-test.js

      - name: Remove one-shot patch machinery
        run: |
          rm -f tools/apply_mimo_patch.py
          rm -f .github/workflows/apply-mimo-file-to-md.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add explicit MiMo file-to-Markdown conversion"
          git push origin HEAD:feat/mimo-file-to-md
